name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Core tests (macOS, no simulator)
        run: swift test --package-path Packages/AWCore

      - name: Build app (iOS Simulator)
        run: |
          xcodebuild build \
            -project AndrewsWorld.xcodeproj -scheme AndrewsWorld \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 40
          exit ${PIPESTATUS[0]}
