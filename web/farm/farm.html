<title>Andrew’s World Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&family=Unbounded:wght@500;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: header, action strip, [altitude rail | map], parameter console; landscape phones put the console beside the map.
   Three skins share one layout: Farm (default, light), Classic (the first look), Cockpit (the glass-cockpit attempt). Each sets its own tokens. */
:root,body[data-skin="farm"]{
  color-scheme:light;
  --paper:#f3eedf; --card:#fffbf1; --well:#efe6d2; --edge:#3a2d27; --ink:#3a2d27; --mute:#8a7a6b; --dim:#b3a594;
  --sel:#2f86ff; --lock:#ff4f9a; --force:#ff8a1f; --go:#33b45a; --sun:#ffd23f; --on:#fff; --onc:#2a201b; --lane:#2f9bff;
  --bw:2px; --sh:0 3px 0 var(--edge); --r:11px; --rp:18px; --rb:4px;
  --f-disp:'Fredoka','Trebuchet MS',ui-rounded,system-ui,sans-serif; --f-ui:'Nunito',ui-rounded,system-ui,sans-serif;
  --stage:radial-gradient(ellipse 40% 30% at 18% 22%,rgba(255,255,255,.22),transparent 70%),radial-gradient(ellipse 35% 25% at 82% 78%,rgba(255,255,255,.16),transparent 70%),#6fc4e8;
}
body[data-skin="classic"]{
  color-scheme:dark;
  --paper:#13121b; --card:#1c1a27; --well:#282536; --edge:#3a3650; --ink:#efecf8; --mute:#9a96b4; --dim:#5d5977;
  --sel:#efecf8; --lock:#ffd36e; --force:#ff6b5a; --go:#ffd36e; --sun:#ffd36e; --on:#1d1606; --onc:#1d1606; --lane:#ffd36e;
  --bw:1px; --sh:none; --r:8px; --rp:14px; --rb:7px;
  --f-disp:'Unbounded','Arial Black',system-ui,sans-serif; --f-ui:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --stage:#1c1a27;
}
body[data-skin="cockpit"],body[data-skin="solucan"]{
  color-scheme:dark;
  --paper:#0a0d11; --card:#0e1318; --well:#151c23; --edge:#34414e; --ink:#e6edf1; --mute:#8b99a5; --dim:#56636e;
  --sel:#52d0e6; --lock:#e06ad6; --force:#f0b44a; --go:#62e09c; --sun:#151c23; --on:#0a0d11; --onc:#0a0d11; --lane:#52d0e6;
  --bw:1px; --sh:none; --r:3px; --rp:4px; --rb:2px;
  --f-disp:'B612 Mono',ui-monospace,Menlo,monospace; --f-ui:'B612',ui-sans-serif,system-ui,sans-serif;
  --stage:linear-gradient(#222c36 1px,transparent 1px) -1px -1px/32px 32px,linear-gradient(90deg,#222c36 1px,transparent 1px) -1px -1px/32px 32px,#0e1318;
}
body[data-skin="solucan"]{
  color-scheme:dark;
  --paper:#07060c; --card:#0e0c17; --well:#18152b; --edge:#2f2a52; --ink:#e6e3f8; --mute:#918bbb; --dim:#4f4a75;
  --sel:#7f78ff; --lock:#c58cff; --force:#ff8a5b; --go:#7f78ff; --sun:#18152b; --on:#07060c; --onc:#07060c; --lane:#7f78ff;
  --bw:1px; --sh:none; --r:5px; --rp:8px; --rb:3px;
  --f-disp:'IBM Plex Mono',ui-monospace,Menlo,monospace; --f-ui:'IBM Plex Sans Condensed',system-ui,sans-serif;
  --stage:radial-gradient(circle at 30% 30%,rgba(140,130,255,.08) 0 1px,transparent 2px) 0 0/11px 13px,radial-gradient(circle at 60% 70%,rgba(0,0,0,.5) 0 4px,transparent 5px) 0 0/37px 31px,linear-gradient(170deg,#100e1c,#08070d);
}
[hidden]{display:none!important}
/* space: a light, Turrell-like field; silver-white chrome with the logo's colours as the only accents */
body[data-skin="station"]{
  color-scheme:light;
  --paper:#eceef4; --card:#fbfcfe; --well:#e6e9f1; --edge:#c6cbd9; --ink:#262b40; --mute:#7a8099; --dim:#b3b8c8;
  --sel:#6c5ce7; --lock:#ff5f9e; --force:#ff8a5b; --go:#2fbf9b; --sun:#fbfcfe; --on:#fff; --onc:#262b40; --lane:#6c5ce7;
  --bw:1px; --sh:0 1px 2px rgba(40,50,90,.08),0 8px 22px rgba(40,50,90,.07); --r:12px; --rp:18px; --rb:6px;
  --f-disp:'Unbounded',system-ui,sans-serif; --f-ui:'IBM Plex Sans Condensed',system-ui,sans-serif; --stage:#03040a;
}
body[data-skin="station"]{background:#c4c9d3}
body[data-skin="station"] .panel,body[data-skin="station"] .rail,body[data-skin="station"] .stage{border-color:rgba(160,168,195,.55)}
body[data-skin="station"] .stage{box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 18px 40px rgba(90,80,170,.18)}
body[data-skin="station"] .top>*,body[data-skin="station"] .acts>*{visibility:hidden}
body[data-skin="station"] .key,body[data-skin="station"] .mod{font:500 11px var(--f-disp);letter-spacing:.04em}
body,.panel,.rail,.stage,.ro,.seg,.itab,.gchip,.fd-val,.rt,.wrow{transition:background-color .6s,color .6s,border-color .6s,box-shadow .6s}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:600 13px var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.app{position:relative;height:100%;max-width:1200px;margin:0 auto;padding:10px 16px 14px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;overflow-anchor:none}

.key,.ib,.mod{height:32px;min-width:32px;padding:0 10px;border:var(--bw) solid var(--edge);border-radius:var(--r);background:var(--card);box-shadow:var(--sh);
  font:600 12px var(--f-disp);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);white-space:nowrap;transition:transform .05s,box-shadow .6s,background-color .6s,color .6s,border-color .6s}
body[data-skin="classic"] .key,body[data-skin="classic"] .ib,body[data-skin="classic"] .mod{background:var(--well);font:500 11px var(--f-ui);letter-spacing:.02em}
body[data-skin="cockpit"] .key,body[data-skin="cockpit"] .ib,body[data-skin="cockpit"] .mod,body[data-skin="solucan"] .key,body[data-skin="solucan"] .ib,body[data-skin="solucan"] .mod{background:var(--well);font:700 10px var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
body[data-skin="classic"] .mod.on,body[data-skin="classic"] .ib.on,body[data-skin="classic"] .key.on{background:#4a4636;color:#ffe9a8;border-color:#ffd36e;box-shadow:inset 0 0 0 1px #ffd36e}
body[data-skin="classic"] .lockb.on{background:#5a3a52;color:#ffd0ee;border-color:#ff8ad0;box-shadow:inset 0 0 0 1px #ff8ad0}
body[data-skin="cockpit"] .mod.on,body[data-skin="cockpit"] .ib.on,body[data-skin="cockpit"] .key.on,body[data-skin="solucan"] .mod.on,body[data-skin="solucan"] .ib.on,body[data-skin="solucan"] .key.on{background:#163a44;color:#8af0ff;border-color:#52d0e6;box-shadow:inset 0 0 8px rgba(82,208,230,.45)}
body[data-skin="cockpit"] .lockb.on,body[data-skin="solucan"] .lockb.on{background:#3c1a3a;color:#ff9cf2;border-color:#e06ad6;box-shadow:inset 0 0 8px rgba(224,106,214,.45)}
.ib{width:32px;padding:0}
body[data-skin="farm"] .key:active:not([disabled]),body[data-skin="farm"] .ib:active:not([disabled]),body[data-skin="farm"] .mod:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.key[disabled],.ib[disabled],.mod[disabled]{opacity:.32;cursor:default}
.key svg,.ib svg{display:block;flex:0 0 auto}
.arm{background:var(--force)!important;color:var(--on)!important}

.top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;font:700 15px 'Unbounded','Arial Black',system-ui,sans-serif;letter-spacing:.04em}
.brand svg{display:block}
.ro{display:flex;flex-direction:column;justify-content:center;height:32px;padding:0 9px;border:var(--bw) solid var(--edge);border-radius:var(--r);background:var(--card);box-shadow:var(--sh);cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;min-width:58px}
.ro span{font:700 8px var(--f-ui);letter-spacing:.12em;color:var(--mute)}
.ro b{font:700 14px/1.05 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--sel);white-space:nowrap}
body[data-skin="classic"] .ro b{color:var(--lock);font:600 13px var(--f-ui)}
.ro.wide{min-width:84px}
.tp{display:flex;gap:6px}
.tp .key{width:52px;padding:0}
.play{background:var(--sun)}
body[data-skin="classic"] .play{background:var(--lock);color:var(--on);border-color:var(--lock)}
body[data-skin="cockpit"] .play,body[data-skin="solucan"] .play{background:var(--sel);color:var(--on);border-color:var(--sel)}
.play.on{background:var(--go);color:var(--on)}
body[data-skin="classic"] .play.on{background:var(--force);border-color:var(--force)}
body[data-skin="cockpit"] .play.on,body[data-skin="solucan"] .play.on{background:var(--go);border-color:var(--go)}
.skinb{min-width:74px}

.ag{display:flex;gap:6px;min-width:0}
/* dice sliders */
.dsl{--amt:0;position:relative;width:98px;height:30px;border:var(--bw) solid var(--edge);border-radius:var(--r);background:var(--card);box-shadow:var(--sh);touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;overflow:hidden;contain:strict;flex:0 0 auto}
body[data-skin="farm"] .dsl{background:#e4f0ff}
body:not([data-skin="farm"]) .dsl{background:var(--well)}
.dsl .dfill{position:absolute;left:0;top:0;bottom:0;width:calc(15px + var(--amt) * (100% - 30px));background:color-mix(in srgb,var(--sel) 22%,transparent)}
.dsl .dl{position:absolute;left:32px;right:4px;top:0;bottom:0;display:flex;align-items:center;font:600 12px var(--f-disp);color:var(--ink);white-space:nowrap;overflow:hidden;pointer-events:none}
body[data-skin="classic"] .dsl .dl{font:500 11px var(--f-ui)}
body[data-skin="cockpit"] .dsl .dl,body[data-skin="station"] .dsl .dl,body[data-skin="solucan"] .dsl .dl{font:700 10px var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
.dsl .dk{position:absolute;top:50%;left:2px;width:24px;height:24px;margin-top:-12px;display:grid;place-items:center;color:var(--sel);z-index:2;will-change:transform;transform:translateX(calc(var(--amt) * (var(--w,98px) - 30px)))}
.dsl .dk svg{width:19px;height:19px}
.dsl.rolling .dk{transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform:translateX(0) rotate(var(--spin,-360deg))}
.dsl.rolling .dfill{transition:width .5s}
.dsl.dis{opacity:.32;pointer-events:none}
.chs{width:38px;height:38px;flex:0 0 38px;position:relative}
.chb{position:absolute;inset:0;border-radius:50%;border:var(--bw) solid var(--edge);background:var(--card);box-shadow:var(--sh);overflow:hidden;padding:0}
.chb svg{display:block;width:100%;height:100%}
.chb.on{box-shadow:0 0 0 3px var(--sel)}
.chb.bob{animation:bob 1.6s ease-in-out infinite}
.chat{position:absolute;inset:0;z-index:15;display:flex;align-items:flex-end;gap:12px;padding:16px;background:linear-gradient(transparent 20%,rgba(20,14,10,.38))}
.chat.in .ch-box{animation:chin .3s cubic-bezier(.2,.9,.3,1.2)}.chat.in .ch-port{animation:chp .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes chin{from{transform:translateY(30px);opacity:0}}@keyframes chp{from{transform:translateY(60px) scale(.8);opacity:0}}
.ch-port{flex:0 0 auto;width:min(150px,26%);aspect-ratio:1;border-radius:18px;overflow:hidden;border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge);align-self:flex-end;background:var(--card)}
.ch-port svg{display:block;width:100%;height:100%}
.ch-box{flex:1;min-width:0;max-height:100%;display:flex;flex-direction:column;gap:7px;padding:12px 14px 12px;border:3px solid var(--edge);border-radius:16px;background:var(--card);box-shadow:0 5px 0 var(--edge);position:relative}
.ch-name{position:absolute;left:14px;top:-15px;padding:3px 12px;border-radius:10px;background:var(--sun);border:2.5px solid var(--edge);font:700 13px var(--f-disp);color:var(--ink)}
.ch-scroll{position:relative;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:6px 2px 2px;touch-action:pan-y;overscroll-behavior:contain}
.ch-log{display:flex;flex-direction:column;gap:6px;font:600 14px/1.42 var(--f-ui);user-select:text;-webkit-user-select:text}
.ch-l.c{color:var(--ink)}
.ch-l.u{align-self:flex-end;max-width:85%;padding:5px 10px;border-radius:12px 12px 2px 12px;background:color-mix(in srgb,var(--sel) 16%,var(--card));color:var(--ink);font-size:13px}
.ch-l.think{color:var(--mute);font-style:italic}
.ch-chips{display:flex;flex-wrap:wrap;gap:5px}
.ch-chips:empty{display:none}
.ch-c{height:28px;padding:0 11px;border-radius:14px;background:var(--well);font:600 12px var(--f-disp);color:var(--ink);border:1.5px solid var(--edge)}
.ch-c.go{background:var(--go);color:#fff}
.ch-in{display:flex;gap:6px}
.ch-in input{flex:1;min-width:0;height:34px;padding:0 12px;border-radius:12px;border:2px solid var(--edge);background:#fff;color:var(--ink);font:600 13.5px var(--f-ui)}
.ch-in .key{height:34px}
.ch-x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--card);border:2.5px solid var(--edge);font:700 18px/1 var(--f-disp);color:var(--ink);box-shadow:0 2px 0 var(--edge);z-index:2}
.ch-skip{position:absolute;right:16px;bottom:-1px;font:700 9px var(--f-ui);color:transparent}
.blitz{position:relative;display:flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 2px;border-radius:15px;border:var(--bw) solid var(--edge);background:var(--card);box-shadow:var(--sh);white-space:nowrap;z-index:40;cursor:pointer}
.blitz i{width:26px;height:26px;border-radius:50%;overflow:hidden;display:block}
.blitz i svg{width:100%;height:100%;display:block}
.blitz b{font:700 13px var(--f-disp);font-variant-numeric:tabular-nums;color:var(--force);min-width:38px}
.blitz button{width:20px;height:20px;border-radius:50%;font:700 13px/1 var(--f-disp);color:var(--mute)}
.pbub{position:absolute;left:0;top:calc(100% + 8px);width:max-content;max-width:240px;white-space:normal;padding:8px 11px;border-radius:12px;border:2px solid var(--edge);background:#fff;color:#3a2d27;font:600 12.5px/1.35 var(--f-ui);box-shadow:0 3px 0 var(--edge);z-index:50;animation:chin .25s}
.pbub::before{content:"";position:absolute;left:12px;top:-8px;border:7px solid transparent;border-bottom-color:var(--edge);border-top:0}
@media (max-width:560px){.ch-port{width:76px}.chat{padding:10px;gap:8px}.ch-log{font-size:13px}}
@keyframes bob{50%{transform:translateY(-3px)}}

.main{flex:1;min-height:170px;display:flex;gap:9px}
.rail{flex:0 0 46px;position:relative;border:var(--bw) solid var(--edge);border-radius:var(--rp);background:var(--card);box-shadow:var(--sh);touch-action:none;cursor:ns-resize;user-select:none;-webkit-user-select:none}
.rail::before{content:"";position:absolute;left:50%;top:8%;bottom:8%;width:4px;margin-left:-2px;border-radius:2px;background:var(--well)}
.rs{position:absolute;left:0;right:0;transform:translateY(-50%);text-align:center;font:600 9px var(--f-disp);color:var(--mute);pointer-events:none}
body:not([data-skin="farm"]) .rs{font-size:8px;letter-spacing:.06em}
.rs span{background:var(--card);padding:0 2px;position:relative}
.rs.off{opacity:.3}
.rt{position:absolute;left:4px;right:4px;height:24px;transform:translateY(-50%);border:var(--bw) solid var(--edge);border-radius:calc(var(--r) - 2px);background:var(--sel);color:var(--on);display:grid;place-items:center;font:700 9.5px var(--f-disp);pointer-events:none;z-index:2;box-shadow:var(--sh)}
body[data-skin="classic"] .rt{background:var(--paper);color:var(--lock);border:2px solid var(--lock)}
body[data-skin="cockpit"] .rt,body[data-skin="solucan"] .rt{background:var(--paper);color:var(--sel);border:1.5px solid var(--sel);font-size:9px}

.stage{flex:1;min-width:0;position:relative;overflow:hidden;border:calc(var(--bw) + .5px) solid var(--edge);border-radius:var(--rp);box-shadow:var(--sh);touch-action:none;user-select:none;-webkit-user-select:none;background:var(--stage)}
body[data-skin="farm"] .stage{border-width:2.5px;box-shadow:0 4px 0 var(--edge)}
.layer{position:absolute;inset:0;transform-origin:0 0;will-change:transform,opacity}
#B{pointer-events:none}
#T{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}

/* blocks */
.b{position:absolute;overflow:hidden;border-radius:var(--rb)}
.in{position:absolute;inset:0}
body:not([data-skin="farm"]) .b{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
body:not([data-skin="farm"]) .in .b{box-shadow:none}
body[data-skin="farm"] .farm{border-radius:22px;box-shadow:0 0 0 3px #f6e1a8,0 0 0 5px var(--edge),0 8px 0 5px rgba(40,60,80,.22)}
body[data-skin="farm"] .in .farm{box-shadow:none}
body[data-skin="farm"] .field{border-radius:12px;border:3px dotted #8b5a2c}
body[data-skin="farm"] .in .field{border-width:1.5px;border-radius:6px}
body[data-skin="farm"] .plot{border-radius:10px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 0 0 2px rgba(58,45,39,.55)}
body[data-skin="farm"] .in .plot{border-radius:4px;box-shadow:none}
body[data-skin="farm"] .furrow{border-radius:8px;box-shadow:inset 0 3px 0 rgba(0,0,0,.16)}
body[data-skin="farm"] .in .furrow{border-radius:3px;box-shadow:none}
.crop{overflow:visible}
body[data-skin="farm"] .crop{border-radius:999px}
body[data-skin="classic"] .crop{border-radius:3px}
body[data-skin="cockpit"] .crop,body[data-skin="solucan"] .crop{border-radius:1.5px}
body[data-skin="farm"] .top.crop{border:2px solid var(--edge);box-shadow:0 2px 0 rgba(58,45,39,.35)}
body[data-skin="farm"] .top.crop::before{content:"";position:absolute;left:4px;top:-8px;width:9px;height:10px;background:#56b83c;border:2px solid var(--edge);border-radius:0 90% 0 90%;transform:rotate(-14deg)}
.b.top{cursor:pointer}
.b.top.sel{overflow:visible}
.b.on::after{content:"";position:absolute;left:8%;right:8%;top:3px;height:4px;border-radius:2px;background:var(--go);z-index:4}
body:not([data-skin="farm"]) .b.on::after{left:0;right:0;top:0;height:2px;border-radius:0}
.crop.on::after{display:none}
.b.cue{outline:3px dashed var(--sel);outline-offset:3px;animation:blink .55s steps(2,jump-none) infinite}
@keyframes blink{50%{outline-color:transparent}}
.b.mu{filter:grayscale(.9) brightness(.85)}
.b.lift{z-index:8;box-shadow:0 0 0 3px var(--sel),0 12px 18px rgba(0,0,0,.3)!important}
.ins{position:absolute;width:5px;margin-left:-2.5px;border-radius:3px;background:var(--sel);box-shadow:0 0 0 2px var(--card);z-index:9;pointer-events:none}
.crop{background-image:var(--tex,none);background-size:var(--texs,auto)}
.crop.rat{background-image:linear-gradient(to left,rgba(0,0,0,.45) 2px,transparent 2px),var(--tex,none);background-size:calc(100% / var(--r)) 100%,var(--texs,auto)}
body[data-skin="farm"] .top.crop.e-drums{--tex:repeating-linear-gradient(90deg,rgba(120,50,0,.22) 0 2px,transparent 2px 9px)}
body[data-skin="farm"] .top.crop.e-drums::before{width:5px;height:8px;left:7px;top:-8px;background:#6b8f2e;border-radius:2px;transform:rotate(8deg)}
body[data-skin="farm"] .top.crop.e-bass::before{background:#3f9c46;left:3px}
body[data-skin="farm"] .top.crop.e-bass::after{content:"";display:block;position:absolute;left:11px;top:-9px;width:8px;height:10px;background:#2f8a3a;border:2px solid var(--edge);border-radius:90% 0 90% 0;transform:rotate(16deg)}
body[data-skin="farm"] .top.crop.e-chords{--tex:radial-gradient(circle at 30% 50%,rgba(255,255,255,.45) 0 18%,transparent 20% 34%,rgba(40,120,40,.25) 36% 44%,transparent 46%);--texs:20px 100%}
body[data-skin="farm"] .top.crop.e-chords::before{display:none}
body[data-skin="farm"] .top.crop.e-lead{--tex:radial-gradient(circle,rgba(190,120,0,.55) 1.3px,transparent 1.8px);--texs:6px 6px}
body[data-skin="farm"] .top.crop.e-lead::before{width:7px;height:14px;top:-10px;left:2px;background:#79b84a;border-radius:0 100% 0 100%;transform:rotate(-30deg)}

body[data-skin="farm"] .mbox{border-width:2.5px;box-shadow:0 5px 0 var(--edge),0 20px 50px rgba(0,0,0,.2)}
.mhead{display:flex;align-items:center;margin-bottom:10px}
.mhead b{flex:1;font:700 17px var(--f-disp)}
.mx-x{width:32px;height:32px;border-radius:50%;font:700 18px/1 var(--f-disp);background:var(--well)}
.mbody{display:flex;flex-direction:column;gap:12px}
/* backpack */
/* notes that carry locks get a pink outline; notes that run past the bar line show an arrow; tails from the bar before are faded */
.crop.ls,body[data-skin="farm"] .top.crop.ls{outline:2px dashed var(--sel);outline-offset:2px;border-radius:3px;background-color:color-mix(in srgb,var(--sel) 22%,transparent)!important}
.crop.lk{outline:2px solid var(--lock);outline-offset:1px;border-radius:3px}
.crop.lk:not(.top){outline-width:1px;outline-offset:0}
.crop .cont{position:absolute;right:16%;top:50%;width:10px;height:13px;margin-top:-6.5px;z-index:5;pointer-events:none}.crop .cont svg{display:block;width:100%;height:100%}
.crop.tail{opacity:.4;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
/* a drum crop is drawn whole inside its step */
body[data-skin="farm"] .roll .top.crop.e-drums{background-size:contain,0 0!important;background-position:center center,left center!important}

.eng-fail{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;padding:12px 14px;border:var(--bw) solid var(--edge);border-radius:var(--r);background:var(--card);color:var(--ink);font-weight:700}

.bagbox{width:min(480px,100%)}
.bag-sec{display:flex;flex-direction:column;gap:8px}
.bag-sec h3{margin:0;font:700 13px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.bag-item{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border:var(--bw) solid var(--edge);border-radius:var(--r);background:var(--well)}
.bag-item .bi-n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bag-item .bi-d{font-size:12px;color:var(--mute)}
.bag-item .bi-a{display:flex;gap:6px}
.bag-item .key{height:32px;padding:0 10px}
.bag-rows{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.bag-rows .key{height:30px;min-width:40px;padding:0 8px}
.gear-ico{width:32px;height:32px;display:block}.gear-ico svg{width:100%;height:100%;display:block;image-rendering:pixelated}
.bag-empty{margin:0;font-size:13px;color:var(--mute)}
.bag-planted{display:flex;flex-wrap:wrap;gap:6px}
.bag-planted .key{height:30px;padding:0 10px}

.prow{display:flex;flex-direction:column;gap:6px}
.prow>span{font:600 12px var(--f-ui);color:var(--mute)}
.pseg{display:flex;border:var(--bw) solid var(--edge);border-radius:var(--r);overflow:hidden;background:var(--well)}
.pseg button{flex:1;height:32px;font:600 12px var(--f-disp);color:var(--mute);border-left:var(--bw) solid var(--edge)}
.pseg button:first-child{border-left:0}
.pseg button.on{background:var(--sel);color:var(--on)}
.prow input[type=range]{width:100%;accent-color:var(--sel)}
.pnote{margin:2px 0 0;font:600 11.5px/1.4 var(--f-ui);color:var(--mute)}
@media (max-width:560px){
  .mscell{flex-basis:42px}
  .pview{height:276px}
}

/* ===== v11 ===== */
body.fly *:not(.panel):not(.rail):not(.stage):not(#bgfx){transition:none!important}
body.fly{transition:background-color .9s,color .9s!important}
.top .dsl{height:32px}
.ag{display:flex;gap:6px;min-width:0}
/* the row under the map: page arrows, transport, editing; the character or info button sits under the rail */
.actrow{display:flex;gap:9px;align-items:center;flex:0 0 auto;height:36px}
.mscell{flex:0 0 46px;display:grid;place-items:center}
.ar{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.arg{display:flex;align-items:center;gap:6px;min-width:0}
.arg.ed{margin-left:auto}
.actrow .ib,.actrow .key{height:32px}
.actrow .tp,.actrow .play,.actrow .rec{width:48px;padding:0}
.ib.on{background:var(--sel);color:var(--on)}
.pgr{gap:3px}
.pgn{min-width:64px;text-align:center;font:600 11.5px var(--f-disp);font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
body:not([data-skin="farm"]) .pgn{font:700 9.5px var(--f-disp);letter-spacing:.08em}
body[data-skin="station"] .actrow>*{visibility:hidden}
@media (max-width:560px){.ar{gap:5px}.arg{gap:3px}.actrow .ib{width:30px;min-width:30px}.actrow .play,.actrow .rec{width:36px}.pgn{display:none}.mscell{flex-basis:42px}}
/* the info / character button: faces slide like the pane does */
.chb{overflow:hidden;color:var(--ink)}
.chi{position:absolute;inset:0;display:block}
.chi svg{display:block;width:100%;height:100%}
.chi.gdi{display:grid;place-items:center}.chi.gdi svg{width:78%;height:78%}
.chi.in-up{animation:fUpIn .32s cubic-bezier(.2,.8,.2,1)}.chi.out-up{animation:fUpOut .32s cubic-bezier(.2,.8,.2,1) forwards}
.chi.in-dn{animation:fDnIn .32s cubic-bezier(.2,.8,.2,1)}.chi.out-dn{animation:fDnOut .32s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fUpIn{from{transform:translateY(100%)}}@keyframes fUpOut{to{transform:translateY(-100%)}}
@keyframes fDnIn{from{transform:translateY(-100%)}}@keyframes fDnOut{to{transform:translateY(100%)}}
.ch-box.gdb{max-width:560px}
.tripb.on{background:var(--sel);color:var(--on)}
/* blitz badge floats over the map now */
.blitz{position:absolute!important;left:10px;top:10px;z-index:12}
/* the Prism page */
.opp{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,1.5fr);gap:12px;height:100%;align-items:center}
.opscr{position:relative;height:100%;max-height:150px;border-radius:12px;background:#111317;box-shadow:inset 0 0 0 2px #2a2e36,0 2px 0 var(--edge);overflow:hidden}
.opscr svg{position:absolute;inset:14px 10px 26px;width:calc(100% - 20px);height:calc(100% - 40px)}
.opscr .opg{stroke:#2c323c;stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.opscr .opw{stroke:#7fd3ff;stroke-width:2.4;fill:none;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px rgba(127,211,255,.6))}
.opn{position:absolute;left:10px;right:10px;bottom:7px;font:600 10px 'IBM Plex Mono',ui-monospace,monospace;color:#cfd6e0;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.opc .kn{width:46px;height:46px;margin:-23px 0 0 -23px;background:#1b1e24;border-color:#2a2e36}
.opc .kn i{background:var(--ec)}
.opc .kn::before{opacity:1}
@media (max-width:560px){.opp{grid-template-columns:1fr;grid-template-rows:70px 1fr;gap:6px}.opscr{max-height:70px}}
/* effect plots on the track view, and the effect itself */
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.55);color:#fff;font:600 12px var(--f-disp);text-align:center;padding:4px;overflow:hidden}
.slot.full{background:rgba(255,251,241,.92);border:2px solid var(--edge);color:var(--ink);box-shadow:0 3px 0 var(--edge)}
body:not([data-skin="farm"]) .slot{border-radius:6px;font:700 9.5px var(--f-disp);letter-spacing:.06em}
body:not([data-skin="farm"]) .slot.full{background:var(--card);box-shadow:none;border-width:1px}
.slot .sl-ic{height:min(48%,40px);aspect-ratio:1;flex:0 0 auto}.slot .sl-ic svg{width:100%;height:100%;display:block}
.slot .sl-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sl-ar{position:absolute;top:50%;height:2px;background:rgba(255,255,255,.7)}
.fxv{position:absolute;inset:0;z-index:14;display:flex;flex-direction:column;gap:14px;padding:18px 20px;background:var(--card);overflow:auto;will-change:transform}
body[data-skin="farm"] .fxv{background:radial-gradient(ellipse at 20% 0%,#fff8e4,transparent 60%),#f6efdc}
.fxv-x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:var(--bw) solid var(--edge);background:var(--card);font:700 20px/1 var(--f-disp);color:var(--ink);box-shadow:var(--sh)}
.fxv-h{display:flex;align-items:center;gap:14px;padding-right:44px}
.fxv-h b{display:block;font:700 22px var(--f-disp)}
.fxv-h span{font:600 12.5px var(--f-ui);color:var(--mute)}
.fxv-ic{width:64px;height:64px;flex:0 0 64px}.fxv-ic svg{width:100%;height:100%;display:block}
.fxv-p{display:flex;flex-direction:column;gap:16px;max-width:640px}
.fxv-p .hfd{grid-template-columns:80px minmax(0,1fr) 66px}
.fxv-p .hfd-s{grid-column:2;font:700 10px var(--f-ui);color:var(--mute);margin-top:-12px}
.fxv-p .hfd.lk .hfd-s,.fxv-p .hfd.lk .hfd-v{color:var(--lock)}
.fxv-p .hfd.lk .hfd-f{background:color-mix(in srgb,var(--lock) 55%,var(--well))}
.fxv-a{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.fxv-a .key{gap:6px}.fxv-mi{width:18px;height:18px;display:inline-block}.fxv-mi svg{width:100%;height:100%;display:block}
.fxv-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.fxv-b{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:var(--r);border:var(--bw) solid var(--edge);background:var(--well);box-shadow:var(--sh);font:600 12px var(--f-ui);color:var(--mute)}
.fxv-b i{width:48px;height:48px;display:block}.fxv-b i svg{width:100%;height:100%}
.fxv-b b{font:700 14px var(--f-disp);color:var(--ink)}

/* ===== v12 ===== */
.barpos{position:absolute;top:7px;right:20px;z-index:11;pointer-events:none;padding:2px 8px;border-radius:9px;background:color-mix(in srgb,var(--card) 80%,transparent);color:var(--ink);font:600 11px var(--f-disp);font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(0,0,0,.12)}
body:not([data-skin="farm"]) .barpos{font:700 10px var(--f-disp);letter-spacing:.06em}
.mbox.mtr{width:min(400px,100%)}
.mtr-big{text-align:center;font:700 40px/1 var(--f-disp);font-variant-numeric:tabular-nums;margin:2px 0 6px}
.mtr-big span{color:var(--mute);margin:0 4px}
.mnum{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.mnum button{height:34px;border-radius:9px;background:var(--well);border:var(--bw) solid var(--edge);font:600 13px var(--f-disp);color:var(--ink)}
.mnum button.on{background:var(--sel);color:var(--on)}
.mnum button[disabled]{opacity:.28}

/* ===== v13: 8-bit farm ===== */
.tree{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.tree svg{display:block;width:100%;height:100%}
.chb svg,.ch-port svg,.blitz i svg,.hatch svg.rk,.flyer svg,.crit svg{image-rendering:pixelated}
body[data-skin="farm"] .top.crop{border:0!important;border-radius:0!important;box-shadow:none!important;background-color:transparent!important;background-repeat:no-repeat!important;overflow:visible}
body[data-skin="farm"] .top.crop::before{display:none!important}
body[data-skin="farm"] .top.crop:not(.rat)::after{display:none!important}
body[data-skin="farm"] .top.crop.e-drums{background-image:var(--sp-pumpkin),var(--sp-vine)!important;background-size:auto 100%,auto 100%!important;background-position:left center,left center!important;background-repeat:no-repeat,repeat-x!important}
body[data-skin="farm"] .top.crop.e-bass{background-image:var(--sp-logend),var(--sp-bark)!important;background-size:auto 100%,auto 100%!important;background-position:right center,left center!important;background-repeat:no-repeat,repeat-x!important}
body[data-skin="farm"] .top.crop.e-lead{background-image:var(--fl,var(--sp-flower0)),var(--sp-vine)!important;background-size:auto 100%,auto 100%!important;background-position:left center,left center!important;background-repeat:no-repeat,repeat-x!important}
body[data-skin="farm"] .top.crop.e-lead.p1{--fl:var(--sp-flower1)}body[data-skin="farm"] .top.crop.e-lead.p2{--fl:var(--sp-flower2)}body[data-skin="farm"] .top.crop.e-lead.p3{--fl:var(--sp-flower3)}
body[data-skin="farm"] .top.crop.e-chords{background-image:var(--hd,var(--sp-head0)),var(--tl,var(--sp-tail0)),var(--bd,var(--sp-body0))!important;background-size:auto 100%,auto 100%,auto 100%!important;background-position:right center,left center,left center!important;background-repeat:no-repeat,no-repeat,repeat-x!important}
body[data-skin="farm"] .crop.e-chords.q0{--hd:var(--sp-head0);--tl:var(--sp-tail0);--bd:var(--sp-body0)}
body[data-skin="farm"] .crop.e-chords.q1{--hd:var(--sp-head1);--tl:var(--sp-tail1);--bd:var(--sp-body1)}
body[data-skin="farm"] .crop.e-chords.q2{--hd:var(--sp-head2);--tl:var(--sp-tail2);--bd:var(--sp-body2)}
body[data-skin="farm"] .crop.e-chords.q3{--hd:var(--sp-head3);--tl:var(--sp-tail3);--bd:var(--sp-body3)}
body[data-skin="farm"] .crop.e-chords.q4{--hd:var(--sp-head4);--tl:var(--sp-tail4);--bd:var(--sp-body4)}
body[data-skin="farm"] .crop.e-chords.q5{--hd:var(--sp-head5);--tl:var(--sp-tail5);--bd:var(--sp-body5)}
body[data-skin="farm"] .crop.e-chords.q6{--hd:var(--sp-head6);--tl:var(--sp-tail6);--bd:var(--sp-body6)}

body[data-skin="farm"] .crop.e-lead:not(.top){background-color:#f878f8!important}

body[data-skin="farm"] .crop.e-chords.q1:not(.top){background-color:#0058f8!important}
body[data-skin="farm"] .crop.e-chords.q2:not(.top){background-color:#d8803a!important}
body[data-skin="farm"] .crop.e-chords.q3:not(.top){background-color:#3c7cf8!important}
body[data-skin="farm"] .crop.e-chords.q4:not(.top){background-color:#383838!important}
body[data-skin="farm"] .crop.e-chords.q5:not(.top){background-color:#9c9c9c!important}

body[data-skin="farm"] .top.crop.rat::after{content:"";display:block;position:absolute;left:0;right:0;bottom:-3px;height:3px;background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px calc(100% / var(--r)))}

   in place of that row's voice, with the row's tune, decay, tone and kit settings. Gear is functions found elsewhere
   that you can put to work on a track. Sounds are kept with the artifact; the list is in your own storage. */
const bag={items:[],data:new Map(),sent:new Set(),plantFor:null,busy:''};
const ROWL=['K','SN','C','R','CH','OH','TM','PC'];
const GEAR_ICON=pix(['..KKKKKKKK..','.KBBBBBBBBK.','.KBWKBBWKBK.','.KBKKBBKKBK.','.KBBBBBBBBK.','.KBBRRRRBBK.','.KBBBBBBBBK.','.KBBSSSSBBK.','.KBSWWWWSBK.','.KBBSSSSBBK.','.KBBBBBBBBK.','..KKKKKKKK..'],{});
const GEAR=[{id:'echo-pedal',name:'Echo pedal',from:'demo gear',desc:'Adds an echo to the track you’re on.',building:'well'}];
const bagEl=$('#bagM');
async function bagLoad(){if(!cloud.db)return;try{const d=await cloud.db.doc(cloud.col+'/backpack').get();if(!d.exists)return;bag.items=d.data().items||[];
  for(const it of bag.items){try{const r=await fetch('/_blob/'+it.asset);if(!r.ok)continue;const j=await r.json();bag.data.set(it.id,{rate:j.rate,pcm:decodePCM(j.pcm)})}catch(e){}}
  bagSendAll();if(!bagEl.hidden)renderBag()}catch(e){console.warn('backpack unavailable:',e)}}
async function bagStore(){if(!cloud.db)return;try{await cloud.db.doc(cloud.col+'/backpack').set({items:bag.items})}catch(e){console.warn('backpack save failed:',e)}}
function encodePCM(f){const i16=new Int16Array(f.length);for(let i=0;i<f.length;i++)i16[i]=Math.max(-32768,Math.min(32767,Math.round(f[i]*32767)));
  const b=new Uint8Array(i16.buffer);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function decodePCM(b64){const s=atob(b64),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);const i16=new Int16Array(b.buffer),f=new Float32Array(i16.length);for(let i=0;i<i16.length;i++)f[i]=i16[i]/32768;return f}
function bagSend(id){const d=bag.data.get(id);if(!d||!aw.ready)return;aw.node.port.postMessage({t:'sample',id:new TextEncoder().encode(id),data:d.pcm,rate:d.rate});bag.sent.add(id)}
function bagSendAll(){for(const id of bag.data.keys())if(!bag.sent.has(id))bagSend(id);if(bag.data.size)awSync()}
async function bagAdd(file){if(!ensureAudio())return;bag.busy='Packing '+file.name+'…';renderBag();
  try{const buf=await ac.decodeAudioData(await file.arrayBuffer()),n=Math.min(buf.length,Math.round(buf.sampleRate*10)),pcm=new Float32Array(n);
    for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)pcm[i]+=d[i]/buf.numberOfChannels}
    const id='snd-'+Date.now().toString(36),name=file.name.replace(/\.[^.]+$/,'').slice(0,40)||'Sound',it={id,name,secs:+(n/buf.sampleRate).toFixed(2),asset:null};
    bag.data.set(id,{rate:buf.sampleRate,pcm});bagSend(id);
    try{const assets=typeof claude!=='undefined'&&claude.use?await claude.use('assets'):null;
      if(assets){const blob=new Blob([JSON.stringify({rate:buf.sampleRate,pcm:encodePCM(pcm)})],{type:'application/json'});const up=await assets.upload(blob);it.asset=up.id}}catch(e){console.warn('sound not kept:',e)}
    bag.items.push(it);await bagStore();bag.busy=it.asset?'':'Packed for this visit only: this view can’t keep files.';
  }catch(e){bag.busy='Couldn’t read '+file.name+' as audio. Try a WAV, MP3, M4A or AIFF file.'}
  renderBag()}
function bagPreview(id){const d=bag.data.get(id);if(!d||!ensureAudio())return;const b=ac.createBuffer(1,d.pcm.length,d.rate);b.copyToChannel(d.pcm,0);const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=.8;s.buffer=b;s.connect(g);g.connect(ac.destination);s.start()}
const onDrums=()=>Lnow()>=2&&DEF_ENG[sel[2]]==='drums';
function plant(id,row){const song=curSong();checkpoint();song.samples=Object.assign({},song.samples||{},{[sel[2]+'.'+row]:id});bag.plantFor=null;changed();renderBag();flash('Planted')}
function digUp(key){const song=curSong();if(!song.samples)return;checkpoint();const s2=Object.assign({},song.samples);delete s2[key];if(Object.keys(s2).length)song.samples=s2;else delete song.samples;changed();renderBag()}
function useGear(g){const song=curSong(),slot=Lnow()>=2?sel[2]:null;if(slot==null){flash('Go to a track first');return}
  const fx=song.fx[slot],i=fx.indexOf(null);if(i<0){flash('This track’s effect slots are full');return}checkpoint();fx[i]=g.building;changed();renderBag();flash(g.name+' on')}
function renderBag(){const song=curSong(),planted=Object.entries(song.samples||{}),name=id=>(bag.items.find(x=>x.id===id)||{}).name||'a lost sound';
  const tip=onDrums()?(curNote()?'Plants on the selected note’s row, '+ROWL[clampi(curNote().pitch,0,7)]+'.':'Choose a row to plant on.'):'Go to the drums track to plant a sound on a row.';
  const items=bag.items.map(it=>`<div class="bag-item"><button class="ib" data-bprev="${esc(it.id)}" aria-label="Hear ${esc(it.name)}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.5v9l8-4.5z" fill="currentColor"/></svg></button>
      <div style="min-width:0"><div class="bi-n">${esc(it.name)}</div><div class="bi-d">${it.secs}s${bag.data.has(it.id)?'':' · not loaded'}</div></div>
      <div class="bi-a"><button class="key" data-bplant="${esc(it.id)}" ${onDrums()&&bag.data.has(it.id)?'':'disabled'}>${sc('Plant')}</button><button class="key" data-bdrop="${esc(it.id)}" aria-label="Remove ${esc(it.name)} from the backpack">×</button></div>
      ${bag.plantFor===it.id?`<div class="bag-rows">${ROWL.map((l,r)=>`<button class="key" data-brow="${r}">${l}</button>`).join('')}</div>`:''}</div>`).join('');
  bagEl.querySelector('.mbody').innerHTML=`
  <section class="bag-sec" aria-labelledby="bagS"><h3 id="bagS">Sounds</h3>
    ${items||'<p class="bag-empty">No sounds yet. Sounds you collect on your travels land here; for now, add your own.</p>'}
    <p class="bag-empty">${tip}</p>
    <div><button class="key" id="bagAddB">${sc('Add a sound file')}</button></div>
    ${bag.busy?`<p class="bag-empty" role="status">${esc(bag.busy)}</p>`:''}
    ${planted.length?`<div class="bag-planted">${planted.map(([k,id])=>`<button class="key" data-bdig="${esc(k)}" title="Dig up">${ROWL[+k.split('.')[1]]||k} · ${esc(name(id))} ×</button>`).join('')}</div><p class="bag-empty">Planted in ${esc(song.name)}. Tap one to dig it up.</p>`:''}
  </section>
  <section class="bag-sec" aria-labelledby="bagG"><h3 id="bagG">Gear</h3>
    ${GEAR.map(g=>`<div class="bag-item"><span class="gear-ico" aria-hidden="true">${GEAR_ICON}</span><div style="min-width:0"><div class="bi-n">${esc(g.name)}</div><div class="bi-d">${esc(g.desc)} (${esc(g.from)})</div></div><div class="bi-a"><button class="key" data-bgear="${g.id}" ${Lnow()>=2?'':'disabled'}>${sc('Use here')}</button></div></div>`).join('')}
    <p class="bag-empty">Gear you find on other planets will appear here.</p>
  </section>`}
function openBag(){ensureAudio();bag.plantFor=null;renderBag();bagEl.hidden=false;uis('in');bagEl.querySelector('.mx-x').focus()}
$('#bag').onclick=openBag;
bagEl.addEventListener('click',e=>{const t=e.target;if(t===bagEl||t.closest('.mx-x')){bagEl.hidden=true;return}
  const q=a=>t.closest('['+a+']'),g=(a,el)=>el.getAttribute(a);let el;
  if(el=q('data-bprev')){bagPreview(g('data-bprev',el));return}
  if(t.closest('#bagAddB')){$('#bagFile').click();return}
  if(el=q('data-bplant')){const id=g('data-bplant',el);if(curNote())plant(id,clampi(curNote().pitch,0,7));else{bag.plantFor=bag.plantFor===id?null:id;renderBag()}return}
  if(el=q('data-brow')){plant(bag.plantFor,+g('data-brow',el));return}
  if(el=q('data-bdrop')){const id=g('data-bdrop',el);bag.items=bag.items.filter(x=>x.id!==id);bagStore();renderBag();return}
  if(el=q('data-bdig')){digUp(g('data-bdig',el));return}
  if(el=q('data-bgear')){const gear=GEAR.find(x=>x.id===g('data-bgear',el));if(gear)useGear(gear)}});
bagEl.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape')bagEl.hidden=true});
$('#bagFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)bagAdd(f)});

/* ================= metronome, count-in, preferences ================= */
const PREF_STORE='fractal-groovebox-prefs';
const prefs=Object.assign({countIn:1,mvol:.6,msound:'wood',mrate:'1/4',ui:true,metro:false,critters:true},(()=>{try{return JSON.parse(localStorage.getItem(PREF_STORE)||'{}')}catch(e){return{}}})());
const savePrefs=()=>{try{localStorage.setItem(PREF_STORE,JSON.stringify(prefs))}catch(e){}};
function metroClick(t,acc){if(!ac)return;const v=prefs.mvol*prefs.mvol*(acc===2?1:acc?.75:.5),g=ac.createGain();g.connect(ac.destination);
  if(prefs.msound==='wood'){const o=osc('sine',acc===2?1250:acc?1050:880,t,t+.08),bp=biq('bandpass',acc===2?1250:950,8),n=noise(t,.03),ng=gainN(.6);o.connect(g);n.connect(bp);bp.connect(ng);ng.connect(g);env(g.gain,t,v*.9,.018)}
  else if(prefs.msound==='click'){const n=noise(t,.02),hp=biq('highpass',acc?5000:3500,.7);n.connect(hp);hp.connect(g);env(g.gain,t,v*1.2,.006)}
  else{const o=osc('square',acc===2?1760:acc?1320:990,t,t+.06),lp=biq('lowpass',3000);o.connect(lp);lp.connect(g);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.35,t+.002);g.gain.setValueAtTime(v*.35,t+.035);g.gain.linearRampToValueAtTime(0,t+.045)}}
const MRATE={'1/16':3,'1/8':6,'1/4':12};
/* a robot saying “get ready” over the count-in bar. The words are spoken by a tiny formant synthesiser (a buzz through three resonances that glide
   from sound to sound, plus filtered noise for s, f, t, k), rendered once into buffers so every count-in sounds identical
   and lands exactly on the metronome: each word is placed so its vowel starts on the tick. */
const PH={i:[270,2290,3010],I:[390,1990,2550],e:[450,2100,2600],E:[530,1840,2480],a:[730,1090,2440],A:[640,1190,2390],o:[570,840,2410],u:[300,870,2240],x:[500,1500,2500],r:[420,1300,1650],l:[360,1000,2400],w:[300,650,2200],n:[250,1450,2500],v:[300,1200,2300]};
const VAMP={n:.35,v:.3,r:.6,l:.55,w:.5};
const NZ={s:[6200,2.5,.5],T:[5000,1,.2],f:[4200,.8,.25],t:[3600,1.2,.9],k:[2200,1.5,.8],v:[4000,1,.06],g:[1700,1.4,.5],d:[3000,1.3,.45]};
const VBUF=[];let vReady=null;
function renderWord(spec,sr){const ph=spec.split(' ').map(s=>[s[0],+s.slice(1)]),T=ph.reduce((a,p)=>a+p[1],0)+.06,ctx=new OfflineAudioContext(1,Math.ceil(T*sr),sr);
  const buzz=ctx.createOscillator();buzz.type='sawtooth';buzz.frequency.setValueAtTime(112,0);buzz.frequency.linearRampToValueAtTime(98,T);
  const vg=ctx.createGain();vg.gain.setValueAtTime(0,0);buzz.connect(vg);const out=ctx.createGain();out.connect(ctx.destination);
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=90;hp.connect(out);
  const fm=[0,1,2].map(j=>{const b=ctx.createBiquadFilter();b.type='bandpass';b.Q.value=[6,10,14][j];const g=ctx.createGain();g.gain.value=[1,.7,.4][j];vg.connect(b);b.connect(g);g.connect(hp);return b});
  const nb=ctx.createBuffer(1,Math.ceil(T*sr),sr),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const ns=ctx.createBufferSource();ns.buffer=nb;const nbp=ctx.createBiquadFilter();nbp.type='bandpass';const ng=ctx.createGain();ng.gain.setValueAtTime(0,0);ns.connect(nbp);nbp.connect(ng);ng.connect(out);
  let t=0,onset=null,first=true;
  for(const[p,du] of ph){const F=PH[p],N=NZ[p],tr=Math.min(.03,du*.45);
    if(F){if(first)fm.forEach((b,j)=>b.frequency.setValueAtTime(F[j],t));else fm.forEach((b,j)=>b.frequency.linearRampToValueAtTime(F[j],t+tr));
      vg.gain.linearRampToValueAtTime((VAMP[p]??1)*.9,t+.015);if(onset==null&&!(p in VAMP))onset=t}
    else vg.gain.linearRampToValueAtTime(0,t+.012);
    if(N){nbp.frequency.setValueAtTime(N[0],t);nbp.Q.setValueAtTime(N[1],t);
      if(p==='t'||p==='k'||p==='g'||p==='d'){ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(N[2],t+.004);ng.gain.linearRampToValueAtTime(0,t+du)}
      else{ng.gain.linearRampToValueAtTime(N[2],t+.02);ng.gain.setValueAtTime(N[2],t+du-.015);ng.gain.linearRampToValueAtTime(0,t+du)}}
    else ng.gain.linearRampToValueAtTime(0,t+.01);
    t+=du;first=false}
  vg.gain.linearRampToValueAtTime(0,t+.04);buzz.start(0);buzz.stop(T);ns.start(0);ns.stop(T);
  return ctx.startRendering().then(buf=>{const c=buf.getChannelData(0);let pk=0;for(let i=0;i<c.length;i++)pk=Math.max(pk,Math.abs(c[i]));const k=pk?.9/pk:1;for(let i=0;i<c.length;i++)c[i]*=k;return{buf,onset:onset??0}})}
function prepVoice(){if(vReady||!ac||typeof OfflineAudioContext==='undefined')return vReady;const sr=22050;
  vReady=renderWord('g.035 E.11 t.03 r.055 E.1 d.03 i.18',sr).then(r=>{VBUF.ready=r}).catch(()=>{});return vReady}
function sayReady(when){const v=VBUF.ready;if(!v||!ac)return;const s=ac.createBufferSource(),g=ac.createGain();s.buffer=v.buf;g.gain.value=Math.min(.75,prefs.mvol*.8+.12);s.connect(g);g.connect(ac.destination);
  try{s.start(Math.max(ac.currentTime,when-v.onset))}catch(e){}}

/* ================= sequencer =================
   The clock runs at 12 ticks a beat: straight bars step every 3 ticks (16ths), triplet bars every 2 (16th triplets). */
const TPB=12;
let playing=false,pos=null,nextT=0,timer=null,vq=[],cur=null,cue=null,hits=[],lastActive=new Set(),startAt=0;
function clampPos(){pos.s=Math.min(pos.s,state.songs.length-1);const so=state.songs[pos.s];pos.c=Math.min(pos.c,so.sections.length-1);pos.p=Math.min(pos.p,secLen(so.sections[pos.c])-1)}
function scheduleTick(t0,td,mu){
  const so=state.songs[pos.s],se=so.sections[pos.c];
  if(pos.tk===0){applySpace(so,t0,mu);applyMaster(so);buildFx(so)}
  if(pos.tk%3===0)applyFx(so,pos.c,pos.p,pos.tk,t0);
  if(prefs.metro&&pos.tk%MRATE[prefs.mrate]===0)metroClick(t0,pos.tk===0?2:pos.tk%mu.tpb===0?1:0);
  se.lanes.forEach((lane,ti)=>{if(!audible(so,ti))return;const bar=lane.bars[pos.p];if(!bar)return;const per=stepTicks(bar);if(pos.tk%per)return;
    const st=pos.tk/per;if(st>=barSteps(mu,bar))return;const sd=td*per,t=t0+(!bar.trip&&st%2===1?sd*mu.swing*.5:0),ch=[state.master,so,se,lane];
    bar.notes.forEach(nt=>{if(nt.step===st)playNote(so,ch.concat(nt),ti,DEF_ENG[ti],nt,t,sd,false)})});
}
function advance(mu){
  pos.tk++;if(pos.tk<barTicks(mu))return;pos.tk=0;
  if(cue){pos={s:cue.s,c:cue.c,p:cue.p,tk:0};cue=null;return}
  const L=Lnow();
  if(L>=4||(L===3&&ui.loop)){pos.s=sel[0];pos.c=sel[1];pos.p=sel[4];return}
  if(L>=2){if(pos.s!==sel[0]||pos.c!==sel[1]){pos.s=sel[0];pos.c=sel[1];pos.p=0;return}pos.p=(pos.p+1)%secLen(state.songs[pos.s].sections[pos.c]);return}
  if(pos.s!==sel[0]){pos.s=sel[0];pos.c=0;pos.p=0;return}
  const so=state.songs[pos.s];pos.p++;if(pos.p>=secLen(so.sections[pos.c])){pos.p=0;pos.c=(pos.c+1)%so.sections.length}
}
function tick(){flushRQ();if(nextT<ac.currentTime-.25)nextT=ac.currentTime+.05;
  while(nextT<ac.currentTime+.12){clampPos();const so=state.songs[pos.s],se=so.sections[pos.c],mu=musAt([state.master,so,se]),td=60/mu.bpm/TPB;
    scheduleTick(nextT,td,mu);const e={t:nextT,s:pos.s,c:pos.c,p:pos.p,tk:pos.tk,bt:barTicks(mu)};vq.push(e);if(vq.length>600)vq.splice(0,vq.length-600);recLog.push(e);if(recLog.length>160)recLog.shift();nextT+=td;advance(mu)}
  flushRQ()}
function play(){if(!ensureAudio()||Lnow()<0)return;recLog=[];recChk=false;vq=[];hits=[];cue=null;cur=null;
  const ci=ui.rec&&prefs.countIn?1:0;awFlush();awFollow(true);awPost({t:'play',context:awCtx(),countIn:ci});
  if(ci)sayReady(ac.currentTime+.05);playing=true;renderPlay()}
function stop(){playing=false;awPost({t:'stop'});vq=[];cur=null;cue=null;hits=[];updatePlayVisuals();renderPlay()}
function renderPlay(){const b=$('#play');b.classList.toggle('on',playing);b.setAttribute('aria-label',playing?'Stop':'Play');$('#playIco').setAttribute('d',playing?'M2 2h8v8H2z':'M2.5 1.5v9l8-4.5z')}
$('#play').onclick=()=>playing?stop():play();
/* playing marks: the classes only change when the playing bar or the cue changes; the playhead moves every frame */
let pvKey='',phEls=[];
function updatePlayVisuals(force){
  const cp=playing&&cur?`${cur.s}.${cur.c}.${cur.p}`:'',key=cp+'|'+(cue?`${cue.s}.${cue.c}.${cue.p}`:'')+'|'+Lnow();
  if(force||key!==pvKey){pvKey=key;
    stage.querySelectorAll('.on,.cue').forEach(e=>e.classList.remove('on','cue'));
    stage.querySelectorAll('.ph').forEach(e=>e.hidden=true);phEls=[];
    if(cue){const L=Lnow();if(L<=1)stage.querySelectorAll(`#A .b.top[data-k="${cue.s}${L===1?'.'+cue.c:''}"]`).forEach(e=>e.classList.add('cue'));
      if(L===2)stage.querySelectorAll(`#A .cell[data-cp="${cue.s}.${cue.c}.${cue.p}"]`).forEach(e=>e.classList.add('cue'))}
    if(cp){const sk=`${cur.s}`,ck=`${sk}.${cur.c}`;
      [sk,ck].forEach(k=>stage.querySelectorAll(`[data-k="${k}"]`).forEach(e=>e.classList.add('on')));
      stage.querySelectorAll(`.b[data-cp="${cp}"]`).forEach(e=>e.classList.add('on'));
      phEls=[...stage.querySelectorAll(`.ph[data-cp="${cp}"]`)];phEls.forEach(e=>e.hidden=false)}}
  if(cp&&phEls.length){const x=(PAD+(cur.tk+1.5)/cur.bt*(1-2*PAD))*100+'%';for(const e of phEls)e.style.left=x}
}
/* in the pattern view the page follows the playing bar */
function followPage(){if(!playing||!cur||Lnow()!==3||!settled()||cur.s!==sel[0]||cur.c!==sel[1]||cur.p===sel[4]||drag||nd)return;if(!curLane().bars[cur.p])return;sel[4]=cur.p;sel[3]=null;dirty=true;setZ(z);renderPager()}
(function frame(){
  if(playing&&ac){const now=ac.currentTime;let ch=false,bar=false;while(vq.length&&vq[0].t<=now){const p0=cur&&cur.p;cur=vq.shift();ch=true;if(p0!==cur.p)bar=true}if(bar)placeBarPos();if(ch)updatePlayVisuals();
    hits=hits.filter(h=>h.t1>now-.05);const act=new Set();for(const h of hits)if(h.t0<=now&&now<h.t1)act.add(h.id);
    for(const id of lastActive)if(!act.has(id))stage.querySelectorAll(`[data-nid="${id}"]`).forEach(e=>e.classList.remove('hit'));
    for(const id of act)if(!lastActive.has(id))stage.querySelectorAll(`[data-nid="${id}"]`).forEach(e=>e.classList.add('hit'));
    lastActive=act;
  }else if(lastActive.size){stage.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));lastActive=new Set()}
  if(aw.ready){awFollow();awMetro();if(aw.wsel!==state.wsel){aw.wsel=state.wsel;awSyncNow()}}
  stepPlanet();
  requestAnimationFrame(frame);
})();

/* ================= characters =================
   One character per level in the Farm world, and an info guide everywhere else. The button sits under the zoom rail;
   tapping it opens a video-game style conversation in the main window: a short intro, then questions to pick from,
   a little lore, and one secret that opens once you have done something yourself. */
const PORT={
  keeper:facePix('keeper'),taco:facePix('taco'),magwood:facePix('magwood'),charles:facePix('charles'),addison:facePix('addison'),patti:facePix('patti'),
  guide:'<svg viewBox="0 0 64 64" class="gd"><circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="22.6" r="3.4" fill="currentColor"/><rect x="29" y="28.5" width="6" height="15" rx="3" fill="currentColor"/></svg>'
};
const LORE_STORE='fractal-groovebox-lore';
let lore={seen:{},open:{},worlds:[],blitz:0};try{Object.assign(lore,JSON.parse(localStorage.getItem(LORE_STORE)||'{}'))}catch(e){}
const saveLore=()=>{try{localStorage.setItem(LORE_STORE,JSON.stringify(lore))}catch(e){}};
/* secrets open when you do the thing yourself */
function loreCheck(k,v){const w=/\.bass\.gl$/.test(k)&&v>.05?'magwood':/\.chords\.ch$/.test(k)&&Math.round(v*6)===2?'charles':/\.lead\.ab$/.test(k)&&v>.5?'addison':k==='rat.rt'&&v>0&&curEng()==='drums'?'taco':null;
  if(w&&!lore.open[w]){lore.open[w]=true;saveLore();flash('★ '+CHARS[w].name+' has a secret for you')}}
const CHARS={
  keeper:{name:'The Keeper',

    qa:[['What grows on the Farm?','Playful, cute, video-game music. Bouncy leads, round basses, sunny chords and toy-box drums. Every song in this library was grown here.'],

      ['What are the levels?','Song, part, track, pattern and note. Zoom with the rail on the left. Each level can hold its own settings, called locks.'],
      ['What is a lock?','A value set on a deeper level. Switch Lock on in the pane and your changes stay on that part, track or note. With Lock off you are shaping the whole song’s sound.'],
      ['What does this pane do here?','Up here it is the master of the selected song: volume, glue (a bus compressor) and saturate. You can rename the song or export it too.'],
      ['How do I start a new song?','Use the plus button above the map, or duplicate a song you like and change it.']],
    lore:[['How old is the library?','Older than the first bar line. The first song was a single kick drum, left in the barn overnight. By morning it had grown a hi-hat.'],
      ['Who built the rocket?','Nobody remembers. It was simply there one spring, under the hatch, with a note: “for visiting”.']],

  taco:{name:'Taco',

    qa:[['What are the eight voices?','Kick, snare, clap, perc, closed hat, open hat, tom and rim. One per row, kick at the bottom. Every one cuts off its own last hit.'],
      ['How is the kick made?','A sine wave that drops in pitch super fast. More punch means a deeper drop and a little click. Ba-dum!'],
      ['What does punch do?','It changes per voice: kick pitch drop, snare noise, clap brightness, hat sparkle, tom sweep, perc FM bite, rim click.'],
      ['What is the clap’s spread?','How far apart the hands land. Low is one tight smack, high is a whole crowd clapping a little out of time.'],

  magwood:{name:'Magwood',
    intro:['Ahoy from down below! Name’s Magwood. I dig the low end.','This bass plays one note at a time, with two oscillators, a sub and a filter.'],
    qa:[['Why only one note at a time?','The bass is monophonic: a new note takes over from the last. With glide up it slides there instead of jumping.'],
      ['What does sub do?','Adds a sine one octave down. All weight, no mud.'],
      ['How do I get a plucky bass?','Low cutoff, some env and a short filter decay. The filter opens and snaps shut: pluck!'],
      ['What is glide?','How long the pitch takes to slide from the previous note. Overlap notes for long slides.'],
      ['What does FM do?','Oscillator B wobbles A’s pitch. A little adds growl, a lot adds clang.'],
      ['What are the bunny and the chick?','Critters are LFOs. The bunny moves the filter, the chick moves the pitch, the ladybug moves the volume. Deeper LFO, bigger hops.']],
    lore:[['Why do you wear goggles?','Bright light hurts my eyes. Low frequencies don’t.'],['What’s under the farm?','Roots, rocks and one very old subwoofer. Don’t tell the Keeper.']],
    secret:{hint:'Turn up the bass glide yourself, then dig me up again.',test:()=>false,

      ['What chord types are there?','Triad, 7th, 9th, sus2, sus4, power and octave. You will find chord on the voice page.'],

  {id:'rpat',name:'Random Pattern',desc:'I’ll scatter notes on one of your melodic tracks. Use them as a jumping-off point.'},
  {id:'rsnd',name:'Random Sound',desc:'One track gets a brand new sound. Build something around it.'},
  {id:'key',name:'Key Change Surprise',desc:'This part moves to a surprise key. Make it fit the rest of the song.'},
  {id:'tempo',name:'Tempo Twister',desc:'This part gets a whole new tempo. Make that the moment everything changes.'},
  {id:'silent',name:'Silence Is Golden',desc:'No drums in this part! Make it groove anyway.'},
  {id:'steal',name:'Steal the Groove',desc:'I’ll borrow a drum beat from another song in your library. Your turn to answer it.'},
  {id:'onetake',name:'One-Take Wonder',desc:'Recording goes on and the bar starts. Play the lead on your keyboard in one take!'}

function startGame(id){const song=curSong(),sec=curSec(),b=sel[4],r=Math.random;checkpoint();let msg='';
  const barOf=s=>{const ln=sec.lanes[s];while(ln.bars.length<=b)ln.bars.push({notes:[]});return ln.bars[b]};
  if(id==='blitz'){startBlitz();msg='Clock’s running! Ten minutes. I’ll be right up here cheering.'}
  else if(id==='rpat'){const s=1+Math.floor(r()*3),bar=barOf(s),steps=barSteps(curMu(),bar);bar.notes=genTrack(song,s,DEF_ENG[s],sec.type,song.prog[b%song.prog.length],r,{wild:true}).filter(n=>n.step<steps);msg=`I sprinkled notes on the ${ELAB[DEF_ENG[s]].toLowerCase()} in bar ${b+1}. Grow something from them!`}

  else if(id==='tempo'){const cur=musAt(chainFor(sel.slice(0,2))).bpm,opts=[70,82,96,110,128,150,170].filter(x=>Math.abs(x-cur)>15),bp=opts[Math.floor(r()*opts.length)];sec.locks['g.bpm']=(bp-50)/150;msg=`Whoosh! This part runs at ${bp} bpm now.`}
  else if(id==='silent'){sec.lanes[0].locks['0.drums.kit.lv']=0;msg='Shh! The drums are silent in this part. Make it groove anyway!'}
  else if(id==='steal'){const others=state.songs.filter(s=>s!==song&&s.sections.length),src=others.length?others[Math.floor(r()*others.length)]:song,ss=src.sections[Math.floor(r()*src.sections.length)],full=ss.lanes[0].bars.filter(x=>x.notes.length),p=full.length?full[Math.floor(r()*full.length)]:{notes:[]};
    barOf(0).notes=reid(JSON.parse(JSON.stringify(p.notes)));msg=`I borrowed a beat from “${src.name}” for bar ${b+1}. Now answer it!`}
  else if(id==='onetake'){msg='Recording is on! Keys A to L play the lead. One take, no take-backs!'}
  changed();

}

const KROW1=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon'],KROW2=['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP'];
let octv=0,recChk=false,recLog=[];const held=new Map();
function keyPitch(code,eng){let i=KROW1.indexOf(code),b=0;if(i<0){i=KROW2.indexOf(code);b=1}if(i<0)return null;
  if(eng==='drums')return b===0&&i<8?i:null;const n=scLen(musOf(sel.slice(0,4))),p=OCT_OFF[eng]+octv*n+b*n+i;return p>=0&&p<ROWS[eng]?p:null}
/* recording lands on whichever bar of this track is playing; the grid of that bar decides the nearest step */
function nearestStep(){if(!playing)return null;const lat=(ac.outputLatency||ac.baseLatency||0),now=ac.currentTime-lat;let best=null,bd=1e9;
  for(const e of recLog){if(e.s!==sel[0]||e.c!==sel[1])continue;const d=Math.abs(e.t-now);if(d<bd){bd=d;best=e}}
  if(!best||bd>.4)return null;const bar=curLane().bars[best.p];if(!bar)return null;const per=stepTicks(bar),steps=barSteps(curMu(),bar);let st=Math.round(best.tk/per),p=best.p;
  if(st>=steps){st=0;p=(p+1)%secLen(curSec());if(!curLane().bars[p])return null}return{p,st}}

function livePress(id,pitch){
  if(!ensureAudio())return;const song=curSong(),ch=chainFor(sel.slice(0,3)),mu=musAt(ch),slot=sel[2],eng=curEng(),t=ac.currentTime+.005;
  if(held.has(id))liveRelease(id);
  const h=aw.nextLive++;awFlush();awPost({t:'liveOn',id:h,song:sel[0],part:sel[1],slot,pitch});
  const rec={h,t0:ac.currentTime,sd:0,n:null,bar:null};held.set(id,rec);
  if(ui.rec){const at=nearestStep();if(at){if(!recChk){checkpoint();recChk=true}const bar=curLane().bars[at.p],steps=barSteps(mu,bar);bar.notes=bar.notes.filter(n=>!(n.step===at.st&&n.pitch===pitch));
    const n=mkNote(at.st,pitch,1,null,null,steps);bar.notes.push(n);sortN(bar.notes);rec.n=n;rec.bar=bar;rec.steps=steps;rec.sd=60/mu.bpm/TPB*stepTicks(bar);dirty=true;setZ(z)}}
}
function liveRelease(id){const h=held.get(id);if(!h)return;held.delete(id);if(h.h)awPost({t:'liveOff',id:h.h});
  if(h.n){h.n.len=clampi(Math.round((ac.currentTime-h.t0)/h.sd),1,h.steps-h.n.step);save();dirty=true;setZ(z)}}
function liveDown(code,e){
  const L=Lnow();if(L<2||!settled())return false;const pitch=keyPitch(code,curEng());if(pitch==null)return false;
  e.preventDefault();if(e.repeat)return true;livePress(code,pitch);return true;
}
const liveUp=code=>liveRelease(code);

/* ================= keyboard ================= */
document.addEventListener('keydown',ev=>{const e={key:ev.key,code:ev.code,repeat:ev.repeat,shiftKey:ev.shiftKey,metaKey:ev.metaKey,ctrlKey:ev.ctrlKey,altKey:ev.altKey,target:ev.target&&ev.target.closest?ev.target:document.body,preventDefault:()=>ev.preventDefault()};
  if(e.key==='Shift'&&!ui.allHeld){ui.allHeld=true;setAll()}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(e.target.closest('input,textarea'))return;
  if(!prefsEl.hidden){if(e.key==='Escape')closePrefs();return}
  if(!meterEl.hidden)return;
  if(e.key===' '&&!e.target.closest('button')){e.preventDefault();if(Lnow()>=0)playing?stop():play();return}
  if(!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.target.closest('.fd-track,.ro')){if(e.code==='KeyZ'||e.code==='KeyX'){if(Lnow()>=2){octv=clampi(octv+(e.code==='KeyX'?1:-1),-1,1);e.preventDefault();flash('Octave '+(octv>0?'+':'')+octv);renderKeys();return}}if(liveDown(e.code,e))return}
  if(e.target.closest('.fd-track,.rail,.ro'))return;
  const L=Lnow();
  if(e.key==='['||e.key==='{'){if(L>=0)e.shiftKey?jumpInst(-1,L):stepPage(-1,L);return}
  if(e.key===']'||e.key==='}'){if(L>=0)e.shiftKey?jumpInst(1,L):stepPage(1,L);return}
  if(e.key==='ArrowUp'||(e.key==='Enter'&&!e.target.closest('button'))){if(L<0)landOn(infoW>=0?infoW:(planetOf(state.wsel)===planet.pi?state.wsel:locsOn(planet.pi)[0]));else zoomTo(L+1);e.preventDefault()}
  else if(e.key==='ArrowDown'||e.key==='Escape'){if(L>0)zoomTo(L-1);e.preventDefault()}
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&L<0){const i=((infoW<0?state.wsel:infoW)+(e.key==='ArrowRight'?1:-1)+3)%3;ensureAudio();openInfo(i);e.preventDefault()}
  else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const d=e.key==='ArrowRight'?1:-1;e.preventDefault();
    if(L===3){pageBar(d);return}
    if(L===4){const n=curBar().notes.length;if(!n)return;sel[3]=((sel[3]??0)+d+n)%n;changed();ensureAudio();audition();return}
    const n=kidsAt(sel.slice(0,L)).length;if(!n)return;selectAt(L,((sel[L]??0)+d+n)%n);uis('tab')}
});
document.addEventListener('keyup',e=>{liveUp(e.code);if(e.key==='Shift'&&ui.allHeld){ui.allHeld=false;setAll()}});
window.addEventListener('blur',()=>{if(ui.allHeld){ui.allHeld=false;setAll()}for(const c of [...held.keys()])liveUp(c)});

computeVis();fixSel();renderUndo();renderPanel();setZ(0);renderPlay();placeTitle();
